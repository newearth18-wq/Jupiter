name: Quality gates

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm secrets:check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build
      - run: pnpm --filter @jupiter/desktop test:integration
      - run: pnpm package:windows
      - uses: actions/upload-artifact@v4
        with:
          name: jupiter-windows-set-0
          path: release/*Setup.exe
          if-no-files-found: error
